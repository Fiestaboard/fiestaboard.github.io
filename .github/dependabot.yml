# Weekly dependency updates.
#
# npm: the Docusaurus site tree at the repo root. Docusaurus packages are
# grouped into a single PR (core, preset, plugins, and type packages all
# pin the same release line and must move together).
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
          - "*docusaurus*"
    ignore:
      # FiestaUI's own "Downstream Upgrade" workflow opens the @fiestaboard/ui
      # bump PR here on every release, so Dependabot can only duplicate it —
      # #50 (ci-bot) and #54 (Dependabot) were the same 5.12.1 -> 5.12.2 bump.
      - dependency-name: "@fiestaboard/ui"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
