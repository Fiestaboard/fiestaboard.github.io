# Full-site build with the deploy configuration (all versions under
# DEPLOY_VERSION_CAP), enforced URL-surface parity against
# tests/baseline.json, a GitHub Pages artifact upload, and — on main only —
# the GitHub Pages deploy itself.
#
# Cutover-ready: pushes to main (post-promotion) build, pass the parity
# gate, and deploy. Pushes to source (pre-promotion / transition) still
# build + parity-check but the deploy job is skipped. workflow_dispatch
# exists so release-snapshot.yml and plugin-stats.yml can trigger a deploy
# after their GITHUB_TOKEN pushes (which never fire push events).
name: Build & Deploy

on:
  push:
    branches: [main, source]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Full build & parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Docusaurus site
        run: npm run build
        env:
          # Headroom above Node's ~4GB default; the version-capped build fits
          # comfortably, but a single version's docs growing shouldn't brick
          # deploys again (they OOMed 2026-06-16 → 2026-07-18).
          NODE_OPTIONS: --max-old-space-size=8192

      - name: URL parity (baseline, enforced)
        run: node scripts/docs-parity.mjs build --compare tests/baseline.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    # Deploy only from main (push to main, or workflow_dispatch run on
    # main). Other refs — e.g. source during the transition — build and
    # parity-check only.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
