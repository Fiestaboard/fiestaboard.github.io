# PR CI: lint, typecheck, format check, and a single-version build
# (DOCS_PR_MODE=1 compiles only the latest docs version so PRs don't
# recompile historical snapshots that haven't changed).
#
# Parity: the full baseline (tests/baseline.json) covers every deployed
# version, so a PR-mode build cannot match it — the baseline compare runs
# report-only here. The enforced check is the URL fixture in --pr-mode,
# which skips entries marked fullBuildOnly. The full baseline compare is
# enforced in build-deploy.yml.
name: PR Build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Lint, typecheck & PR-mode build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Depth 2 so the PR merge commit's parents are available for the
          # synced-paths guard diff below.
          fetch-depth: 2

      - name: Guard synced paths
        # docs/, data/plugin-registry.json, and data/plugin-previews.json are
        # synced copies from Fiestaboard/FiestaBoard (scripts/pull-docs.mjs);
        # the rest of data/ is owned by automation in this repo. PRs must not
        # modify any of it — changes belong in the FiestaBoard repo or arrive
        # via the sync.
        #
        # Exempt the two branches the automation itself lands on. main is
        # protected, so release-snapshot.yml and plugin-stats.yml can no longer
        # push their output straight at it — they open PRs, and that output IS
        # the guarded content. Without this, the guard rejects the only route
        # those workflows have left (it did, on #57 and #59).
        #
        # Matched on branch name, not on actor: the actor for both is
        # github-actions[bot], which would also exempt every Dependabot PR and
        # anything else a bot opens. These two names belong to the two
        # workflows and to nothing else.
        if: >-
          github.head_ref != 'data/plugin-stats' &&
          !startsWith(github.head_ref, 'docs/snapshot-')
        run: |
          CHANGED=$(git diff --name-only HEAD^1 HEAD -- docs/ data/)
          if [ -n "$CHANGED" ]; then
            echo "::error::PRs must not modify synced paths (docs/, data/):"
            echo "$CHANGED"
            exit 1
          fi
          echo "No synced-path changes."

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build (PR mode, latest version only)
        run: npm run build
        env:
          DOCS_PR_MODE: "1"

      - name: URL parity (fixture, PR mode)
        run: node scripts/docs-parity.mjs build --fixture tests/routes.fixture.json --pr-mode

      - name: URL parity (baseline, report-only in PR mode)
        run: node scripts/docs-parity.mjs build --compare tests/baseline.json || true
