# On a FiestaBoard release (repository_dispatch type "release", sent from the
# FiestaBoard release workflow with client_payload.tag = vX.Y.Z), snapshot the
# docs at that tag into a Docusaurus version X.Y.
#
# NOTE: repository_dispatch only triggers the workflow file on the DEFAULT
# branch (main). Until the cutover promotes this branch to main, the dispatch
# path is inert; rehearsals use workflow_dispatch with a scratch
# target_branch instead.
#
# Build/deploy: none here, deliberately. build-deploy.yml owns the site
# build and (on main) the Pages deploy. Pushes made with the default
# GITHUB_TOKEN do not trigger other workflows' push events, so after a
# snapshot commit lands on main this workflow explicitly dispatches
# build-deploy.yml (GITHUB_TOKEN CAN start workflow_dispatch runs).
#
# Tokens:
#   - Checking out Fiestaboard/FiestaBoard at the tag needs no PAT — the repo
#     is public, plain actions/checkout works.
#   - Committing to THIS repo needs no PAT either: main is protected, so the
#     snapshot goes onto a branch and through a PR, which GITHUB_TOKEN can do
#     with `contents: write` + `pull-requests: write`. No RELEASE_PAT exists
#     in this repo; the `secrets.RELEASE_PAT || github.token` fallbacks below
#     resolve to GITHUB_TOKEN today and are kept only in case one is added.
#   - A PR opened with GITHUB_TOKEN DOES start pr-build.yml here, but the run
#     lands in `action_required`: the approval policy is "first-time
#     contributors" and github-actions[bot] never graduates into a contributor.
#     Someone has to approve the run before the required check reports. PRs
#     opened by the fiestaboard-ci-bot App run ungated (see #50), so giving
#     this repo that identity — or any PAT — would remove the click.
name: Release snapshot

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      tag:
        description: "FiestaBoard release tag (vX.Y.Z)"
        required: true
        type: string
      target_branch:
        description: "Branch to snapshot on (rehearsals use a scratch branch)"
        required: false
        default: main
        type: string
      force_snapshot:
        description: >-
          Re-snapshot even if the version already exists (rehearsals only;
          ignored when target_branch is main)
        required: false
        default: false
        type: boolean

concurrency:
  group: release-snapshot
  cancel-in-progress: false

permissions:
  contents: write
  # main is protected, so the snapshot lands as a PR (see "Commit snapshot").
  # Without this the branch pushes fine and then `gh pr create` dies on
  # "Resource not accessible by integration (createPullRequest)" — a red run
  # that had already done all the expensive work.
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || 'main' }}
      FORCE_SNAPSHOT: ${{ github.event_name == 'workflow_dispatch' && inputs.force_snapshot && 'true' || 'false' }}
    steps:
      - name: Parse tag vX.Y.Z -> X.Y
        id: parse
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "error: tag '$TAG' is not vX.Y.Z" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "docs_version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - name: Checkout site repo
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.RELEASE_PAT || github.token }}

      # Public repo: plain checkout, no token needed.
      - name: Checkout FiestaBoard at release tag (sparse)
        uses: actions/checkout@v7
        with:
          repository: Fiestaboard/FiestaBoard
          ref: ${{ steps.parse.outputs.tag }}
          path: .fiestaboard-src
          sparse-checkout: |
            docs
            plugin-registry.json
            plugin-previews.json
          sparse-checkout-cone-mode: false

      - name: Bail out if version already snapshotted
        id: version
        env:
          DOCS_VERSION: ${{ steps.parse.outputs.docs_version }}
        run: |
          set -euo pipefail
          exists=false
          if [ -f versions.json ] && \
             python3 -c 'import json,os,sys; sys.exit(0 if os.environ["DOCS_VERSION"] in json.load(open("versions.json")) else 1)'; then
            exists=true
          fi
          if [ "$exists" = true ]; then
            # force_snapshot lets rehearsals re-cut an existing version on a
            # scratch branch; the bail stays mandatory on main.
            if [ "$FORCE_SNAPSHOT" = "true" ] && [ "$TARGET_BRANCH" != "main" ]; then
              echo "Version $DOCS_VERSION exists but force_snapshot is set on non-main branch; re-snapshotting."
              echo "created=true" >> "$GITHUB_OUTPUT"
              echo "recut=true" >> "$GITHUB_OUTPUT"
            else
              echo "Version $DOCS_VERSION already exists in versions.json; nothing to do."
              echo "created=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh current docs from tag (same allowlist as pull-docs.mjs)
        if: steps.version.outputs.created == 'true'
        run: |
          set -euo pipefail
          # docs/** minus docs/internal/** -> docs/**  (mirror: deletions
          # propagate). docs/README.md is this repo's generated banner and
          # docs/.source-sha is rewritten below — keep both out of the mirror.
          rsync -a --delete \
            --exclude='/internal/' --exclude='/.source-sha' --exclude='/README.md' \
            .fiestaboard-src/docs/ docs/
          rm -rf docs/internal
          mkdir -p data
          cp .fiestaboard-src/plugin-registry.json data/plugin-registry.json
          cp .fiestaboard-src/plugin-previews.json data/plugin-previews.json
          git -C .fiestaboard-src rev-parse HEAD > docs/.source-sha
          rm -rf .fiestaboard-src

      - name: Setup Node
        if: steps.version.outputs.created == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Create Docusaurus version
        if: steps.version.outputs.created == 'true'
        env:
          DOCS_VERSION: ${{ steps.parse.outputs.docs_version }}
          RECUT: ${{ steps.version.outputs.recut }}
        run: |
          set -euo pipefail
          npm ci
          if [ "$RECUT" = "true" ]; then
            # Drop the existing snapshot so docs:version can re-create it.
            rm -rf "versioned_docs/version-$DOCS_VERSION"
            rm -f "versioned_sidebars/version-$DOCS_VERSION-sidebars.json"
            python3 - <<'EOF'
          import json, os
          v = os.environ["DOCS_VERSION"]
          versions = json.load(open("versions.json"))
          versions = [x for x in versions if x != v]
          with open("versions.json", "w") as f:
              json.dump(versions, f, indent=2)
              f.write("\n")
          EOF
          fi
          npx docusaurus docs:version "$DOCS_VERSION"
          # docs:version copies docs/ verbatim; the banner README and
          # .source-sha are working-tree metadata, not part of a snapshot
          # (imported production snapshots contain neither).
          rm -f "versioned_docs/version-$DOCS_VERSION/README.md" \
                "versioned_docs/version-$DOCS_VERSION/.source-sha"

      # Cutting a version moves the site's whole URL surface: the new version
      # takes over the unprefixed /docs/*, the previous latest gains its own
      # number, and whatever drops past DEPLOY_VERSION_CAP becomes redirect
      # stubs. build-deploy.yml's baseline compare is enforced and fails on any
      # added or removed route, so a snapshot that does not carry the refreshed
      # baseline merges green and then never deploys — the version ships to
      # nobody. (8.32 landed that way: 63 routes added, 62 removed.)
      #
      # The compare runs first, report-only, so the log says what moved before
      # the freeze is rewritten — a snapshot that drops a page should be
      # visible in the PR, not absorbed silently.
      #
      # Not automated: tests/routes.fixture.json pins a few explicit version
      # numbers, and an entry whose version falls past the cap starts
      # expecting a page where a redirect now lives. That one still needs a
      # human.
      - name: Refresh the URL baseline for the new version
        if: steps.version.outputs.created == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          npm run build
          node scripts/docs-parity.mjs build --compare tests/baseline.json || true
          node scripts/docs-parity.mjs build > tests/baseline.json

      - name: Commit snapshot
        id: commit
        if: steps.version.outputs.created == 'true'
        env:
          DOCS_VERSION: ${{ steps.parse.outputs.docs_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "FiestaBoard CI"
          git config user.email "ci@fiestaboard.app"
          git add -A -- docs versioned_docs versioned_sidebars versions.json data tests/baseline.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "docs: snapshot version $DOCS_VERSION"

          # main is protected (PR required), and this repo has no RELEASE_PAT to
          # bypass with, so a direct push is rejected with GH013 — which is what
          # had been silently failing this workflow on every release, leaving
          # the site without a snapshot for the version just shipped. Push a
          # branch and open a PR instead.
          #
          # A rehearsal against a scratch target_branch still pushes directly;
          # only main is protected.
          if [ "$TARGET_BRANCH" != "main" ]; then
            git push origin "HEAD:$TARGET_BRANCH"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="docs/snapshot-$DOCS_VERSION"
          git push --force origin "HEAD:$BRANCH"

          # REST, not `gh pr view`. That goes through GraphQL and answers about
          # ANY pull request on the branch, including a merged one — so a
          # re-snapshot onto an already-merged branch would find a PR, skip the
          # create, and silently strand the new commit. `state=open` is the
          # question actually being asked. (FiestaBoard#1689 landed the same
          # swap for the capture PR.)
          EXISTING=$(gh api \
            "repos/$GITHUB_REPOSITORY/pulls?head=${GITHUB_REPOSITORY%%/*}:$BRANCH&state=open" \
            --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "refreshed the open snapshot PR #$EXISTING"
          else
            NUM=$(gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" \
              -f title="docs: snapshot version $DOCS_VERSION" \
              -f head="$BRANCH" -f base=main \
              -f body="Docs snapshot for FiestaBoard $DOCS_VERSION, cut by \`release-snapshot.yml\`. Merging publishes it as the latest version on the site." \
              --jq .number)
            echo "opened snapshot PR #$NUM"
          fi
          # A snapshot behind a PR is not on main yet, so the deploy trigger
          # below must not fire.
          echo "pushed=false" >> "$GITHUB_OUTPUT"

      # The push above used GITHUB_TOKEN (unless RELEASE_PAT is set), which
      # never fires other workflows' push triggers — so start the site
      # build+deploy explicitly. Only when a commit actually landed on main.
      - name: Trigger site build & deploy
        if: steps.commit.outputs.pushed == 'true' && env.TARGET_BRANCH == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-deploy.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH"
