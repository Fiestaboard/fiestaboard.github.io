<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiestaboard</title>
  <style>
    :root {
      --primary: #e85d04;
      --bg: #fefae0;
      --text: #212529;
      --muted: #6c757d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .container { max-width: 600px; }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .tagline { color: var(--muted); font-size: 1.125rem; margin-bottom: 2rem; }
    .links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .links a {
      display: inline-block;
      padding: 0.625rem 1.25rem;
      border: 2px solid var(--primary);
      border-radius: 6px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s, color 0.2s;
    }
    .links a:hover { background: var(--primary); color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎉 Fiestaboard</h1>
    <p class="tagline">Welcome to the Fiestaboard organization.</p>
    <div class="links">
      <a href="https://github.com/Fiestaboard">GitHub</a>
    </div>
  </div>
</body>
</html>
